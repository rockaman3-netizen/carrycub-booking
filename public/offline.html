<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CarryCub — You're offline</title>
<style>
  :root { color-scheme: light; }
  html, body {
    height: 100%; margin: 0;
    background: #f3f4f6; color: #0b1b3f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    padding-top: max(env(safe-area-inset-top), 24px);
    padding-bottom: max(env(safe-area-inset-bottom), 24px);
  }
  .emoji { font-size: 48px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; color: #4b5563; max-width: 320px; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #f97316; color: #fff; border: none; border-radius: 16px;
    padding: 14px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { background: #ea580c; }
</style>
</head>
<body>
  <span class="emoji" aria-hidden="true">📡</span>
  <h1>You're offline</h1>
  <p>
    CarryCub needs an internet connection for live bookings and tracking —
    this data comes straight from the server, so it can't be shown offline.
    Please check your connection and try again.
  </p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
