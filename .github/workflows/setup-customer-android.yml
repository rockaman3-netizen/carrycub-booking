name: Setup Customer Android (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - name: Use customer config temporarily
        run: cp capacitor.config.customer.ts capacitor.config.ts

      - name: Add customer Android platform
        run: npx cap add android

      - name: Restore driver's original config
        run: git checkout -- capacitor.config.ts

      - name: Commit new android-customer folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-customer
          git commit -m "Add customer Android platform"
          git push
