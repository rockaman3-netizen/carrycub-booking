name: Build Android APK (Customer)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - name: Use customer config
        run: cp capacitor.config.customer.ts capacitor.config.ts

      - name: Sync customer Android project
        run: npx cap sync android

      - name: Build APK
        run: cd android-customer && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: carrycub-customer-apk
          path: android-customer/app/build/outputs/apk/debug/app-debug.apk
