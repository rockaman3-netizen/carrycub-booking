name: Build Android APK (Customer)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run npm install
        run: npm install

      - name: Use customer config
        run: cp capacitor.config.customer.ts capacitor.config.ts

      - name: Sync customer Android project
        run: |
          mkdir -p android-customer/app/src/main/assets
          npx cap sync android

      - name: Build APK
        run: |
          cd android-customer
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: carrycub-customer-apk
          path: android-customer/app/build/outputs/apk/debug/app-debug.apk
